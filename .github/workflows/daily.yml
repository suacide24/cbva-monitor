name: CBVA Monitor

on:
  schedule:
    # Daily 9 AM PT (UTC-7) — rating checks + first tournament scan of the day
    - cron: "0 16 * * *"
    # Weekend: every 30 min during tournament hours (7 AM–8 PM PT)
    # 7 AM–4:30 PM PT = 14:00–23:30 UTC on Sat(6) and Sun(0)
    - cron: "*/30 14-23 * * 6,0"
    # 5 PM–8 PM PT bleeds into the next UTC day (Sun/Mon)
    - cron: "*/30 0-3 * * 0,1"
  workflow_dispatch:

permissions:
  contents: write   # needed to commit updated state.json

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Install Playwright system deps
        run: playwright install-deps chromium

      - name: Fetch player names
        run: |
          PLAYER_NAMES=$(curl -fsSL https://gist.githubusercontent.com/suacide24/02b7b07f32a25d0299b6bef8dc7aa4c9/raw/players.txt | tr '\n' ',' | sed 's/,$//')
          echo "PLAYER_NAMES=$PLAYER_NAMES" >> $GITHUB_ENV

      - name: Run CBVA monitor
        env:
          EMAIL_FROM:      ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:        ${{ secrets.EMAIL_TO }}
          CBVA_EMAIL:      ${{ secrets.CBVA_EMAIL }}
          CBVA_PASSWORD:   ${{ secrets.CBVA_PASSWORD }}
          PLAYER_NAMES:    ${{ env.PLAYER_NAMES }}
        run: python monitor.py

      - name: Commit updated state.json
        run: |
          git config user.name  "cbva-monitor[bot]"
          git config user.email "cbva-monitor@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "No state changes — skipping commit."
            exit 0
          fi
          git commit -m "chore: update state $(date -u +%Y-%m-%dT%H:%M)"
          # Retry up to 3 times with random backoff to survive concurrent runs
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed — retrying in $((RANDOM % 10 + 5))s..."
            sleep $((RANDOM % 10 + 5))
          done
