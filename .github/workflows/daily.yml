name: CBVA Daily Monitor

on:
  schedule:
    # 9:00 AM Pacific Time (UTC-7 in summer)
    - cron: "0 16 * * *"
  workflow_dispatch: # allows manual trigger from the GitHub Actions tab

permissions:
  contents: write   # needed to commit updated state.json

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Install Playwright system deps
        run: playwright install-deps chromium

      - name: Fetch player names
        run: |
          PLAYER_NAMES=$(curl -fsSL https://gist.githubusercontent.com/suacide24/02b7b07f32a25d0299b6bef8dc7aa4c9/raw/players.txt | tr '\n' ',' | sed 's/,$//')
          echo "PLAYER_NAMES=$PLAYER_NAMES" >> $GITHUB_ENV

      - name: Run CBVA monitor
        env:
          EMAIL_FROM:      ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:        ${{ secrets.EMAIL_TO }}
          CBVA_DEBUG:      "1"
        run: python monitor.py

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug_*.png
          if-no-files-found: ignore

      - name: Commit updated state.json
        run: |
          git config user.name  "cbva-monitor[bot]"
          git config user.email "cbva-monitor@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || \
            git commit -m "chore: update player state $(date +%Y-%m-%d)" && \
            git push
