name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps (no Playwright needed for unit tests)
        run: pip install python-dotenv

      - name: Run unit tests
        run: python3 tests/test_monitor.py -v
